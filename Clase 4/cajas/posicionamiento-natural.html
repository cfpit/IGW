<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamiento Natural</title>
    <style>
        .caja {
            width: 150px;
            height: 150px;
            margin: 0px;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            /* position: static; es el valor por defecto (posicionamiento natural / flujo normal) */
        }

        .caja-1 {
            background-color: #e74c3c;
        }

        .caja-2 {
            background-color: #3498db;
        }

        .caja-3 {
            background-color: #2ecc71;
        }

        /*
            html {
                font-size: 20px;
            }
        */
    </style>
</head>
<body>

    <div class="caja caja-1">Caja 1</div>
    <div class="caja caja-2">Caja 2</div>
    <div class="caja caja-3">Caja 3</div>

</body>
</html>
