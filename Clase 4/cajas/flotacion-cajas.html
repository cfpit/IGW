<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propiedades de Flotación</title>
    <style>
        .container{
            width: 600px;
            height: 400px;
            border: 3px red solid;
        }
        .caja{
            width: 100px;
            height: 100px;
            border: 3px blue solid;
            float: left;
            margin: 10px;
        }
        .caja-1{
            background-color: bisque;
        }
        .caja-2{
            background-color: violet;
        }
        .caja-3{
            background-color: brown;
        }
        .caja-4{
            background-color: orange;
            width: 100px;
            height: 100px;
            border: 3px blue solid;
            clear: left;/* corta la flotacion -> se dispone abajo */
            margin: 10px;
        }
       
    </style>
</head>
<body>
    <div class="container">
        <div class="caja caja-1">Caja 1</div>
        <div class="caja caja-2">Caja 2</div>
        <div class="caja caja-3">Caja 3</div>
        <div class="caja-4">Caja 4</div>
    </div>
</body>
</html>
